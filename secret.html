<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✦ | 星ノ空</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700;800&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-color: #FFFDF5;
      --main-purple: #6B38A3;
      --accent-yellow: #FFD700;
      --purple-soft: #F5EFFF;
      --text-dark: #332244;
      --text-muted: #665577;
      --white: #ffffff;
      --font-mincho: 'Shippori Mincho', serif;
      --font-gothic: 'Zen Kaku Gothic New', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg-color);
      color: var(--text-dark);
      font-family: var(--font-gothic);
      line-height: 1.8;
    }

    /* ── パスワード画面 ── */
    #password-screen {
      position: fixed;
      inset: 0;
      background: var(--bg-color);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .pw-box {
      background: var(--white);
      border-radius: 24px;
      padding: 50px 60px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(107,56,163,0.12);
      max-width: 400px;
      width: 90%;
    }
    .pw-logo {
      font-size: 2rem;
      margin-bottom: 8px;
    }
    .pw-sub {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 30px;
      letter-spacing: 0.1em;
    }
    .pw-input {
      width: 100%;
      padding: 14px 20px;
      border: 2px solid var(--purple-soft);
      border-radius: 12px;
      font-size: 1rem;
      font-family: var(--font-gothic);
      outline: none;
      transition: border-color 0.3s;
      margin-bottom: 16px;
    }
    .pw-input:focus { border-color: var(--main-purple); }
    .pw-btn {
      width: 100%;
      padding: 14px;
      background: var(--main-purple);
      color: var(--white);
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-family: var(--font-gothic);
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    .pw-btn:hover { background: #5a2d8a; transform: translateY(-2px); }

    /* ── メインコンテンツ ── */
    #secret-content { display: none; }

    /* ── ナビ ── */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      height: 70px;
      background: rgba(255,253,245,0.95);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(107,56,163,0.08);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5vw;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo-container {
      display: flex;
      align-items: center;
      text-decoration: none;
      gap: 12px;
    }
    .nav-logo-img { height: 32px; width: auto; }
    .logo-text {
      font-family: var(--font-mincho);
      font-weight: 800;
      font-size: 1.3rem;
      color: var(--main-purple);
      letter-spacing: 0.1em;
    }
    .nav-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }
    .btn-back-nav {
      padding: 7px 18px;
      border: 1.5px solid #e0d8f0;
      color: var(--text-muted);
      background: none;
      border-radius: 20px;
      font-size: 0.82rem;
      font-family: var(--font-gothic);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-back-nav:hover { border-color: var(--main-purple); color: var(--main-purple); }

    /* ── ページヘッダー ── */
    .page-header {
      padding: 120px 30px 50px;
      text-align: center;
    }
    .page-header .section-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--main-purple);
      text-transform: uppercase;
      border: 1px solid rgba(107,56,163,0.3);
      padding: 6px 18px;
      border-radius: 100px;
      margin-bottom: 20px;
    }
    .page-header h1 {
      font-family: var(--font-mincho);
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 800;
      color: var(--text-dark);
    }

    /* ── コンテンツ共通 ── */
    .content-area {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 30px 100px;
    }

    /* ── セクションタイトル ── */
    .section-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-mincho);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--main-purple);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--purple-soft);
    }
    .section-heading::before {
      content: '';
      width: 4px;
      height: 1.3rem;
      background: var(--main-purple);
      border-radius: 2px;
    }

    /* ── 資料カード ── */
    .doc-list { display: flex; flex-direction: column; gap: 12px; }
    .doc-card {
      background: var(--white);
      border-radius: 16px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 2px 12px rgba(107,56,163,0.05);
      border-left: 4px solid var(--accent-yellow);
      transition: box-shadow 0.2s;
    }
    .doc-card:hover { box-shadow: 0 6px 24px rgba(107,56,163,0.1); }
    .doc-info { flex: 1; min-width: 0; }
    .doc-title {
      font-family: var(--font-mincho);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .doc-date { font-size: 0.8rem; color: var(--text-muted); }
    .btn-drive {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 20px;
      background: var(--main-purple);
      color: var(--white);
      text-decoration: none;
      border-radius: 100px;
      font-size: 0.82rem;
      font-weight: 700;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .btn-drive:hover { background: #5a2d8a; }

    /* ── アップロードフォーム ── */
    .upload-area {
      margin-bottom: 48px;
      background: var(--white);
      border-radius: 20px;
      padding: 28px 32px;
      box-shadow: 0 4px 20px rgba(107,56,163,0.06);
    }
    .form-input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e0d8f0;
      border-radius: 10px;
      font-size: 0.88rem;
      font-family: var(--font-gothic);
      color: var(--text-dark);
      background: var(--white);
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 10px;
    }
    .form-input:focus { border-color: var(--main-purple); }
    .submit-btn {
      padding: 10px 28px;
      background: var(--main-purple);
      color: var(--white);
      border: none;
      border-radius: 100px;
      font-size: 0.88rem;
      font-family: var(--font-gothic);
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 4px;
    }
    .submit-btn:hover { background: #5a2d8a; }
    .submit-btn:disabled { background: #ccc; cursor: not-allowed; }

    /* ── ファイルアップロード UI ── */
    .file-pick-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .file-pick-btn {
      padding: 7px 16px;
      border: 1.5px solid var(--main-purple);
      color: var(--main-purple);
      background: var(--white);
      border-radius: 8px;
      font-size: 0.82rem;
      font-family: var(--font-gothic);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .file-pick-btn:hover { background: var(--purple-soft); }
    .file-pick-info {
      font-size: 0.78rem;
      color: var(--text-muted);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .or-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
      color: var(--text-muted);
      font-size: 0.75rem;
    }
    .or-divider::before, .or-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e0d8f0;
    }

    /* ── チャット ── */
    .chat-area {
      margin-bottom: 48px;
      background: var(--white);
      border-radius: 20px;
      padding: 28px 32px;
      box-shadow: 0 4px 20px rgba(107,56,163,0.06);
    }
    .chat-toolbar {
      display: flex;
      align-items: center;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--purple-soft);
    }
    .chat-toolbar-title {
      font-family: var(--font-mincho);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--main-purple);
    }
    .chat-refresh-btn {
      margin-left: auto;
      background: none;
      border: 1px solid #e0d8f0;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.78rem;
      font-family: var(--font-gothic);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .chat-refresh-btn:hover { border-color: var(--main-purple); color: var(--main-purple); }
    .chat-list {
      max-height: 360px;
      overflow-y: auto;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-msg {
      background: var(--bg-color);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .chat-msg-body { flex: 1; }
    .chat-msg-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--main-purple);
      margin-bottom: 3px;
    }
    .chat-msg-text {
      font-size: 0.9rem;
      line-height: 1.65;
      color: var(--text-dark);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .chat-msg-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }
    .chat-msg-date { font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; }
    .chat-delete-btn {
      background: none;
      border: none;
      font-size: 0.72rem;
      color: #ccc;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .chat-delete-btn:hover { color: #e53e3e; background: #fff0f0; }
    .chat-form { display: flex; flex-direction: column; gap: 8px; }
    .chat-submit-btn {
      align-self: flex-end;
      padding: 9px 24px;
      background: var(--main-purple);
      color: var(--white);
      border: none;
      border-radius: 100px;
      font-size: 0.85rem;
      font-family: var(--font-gothic);
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .chat-submit-btn:hover { background: #5a2d8a; }
    .chat-submit-btn:disabled { background: #ccc; cursor: not-allowed; }
    .chat-empty { color: var(--text-muted); font-size: 0.88rem; text-align: center; padding: 20px 0; }

    /* ── ローディング ── */
    .loading-area {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--purple-soft);
      border-top-color: var(--main-purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-msg {
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 40px 0;
      text-align: center;
    }

    /* ── スクロールトップ ── */
    .scroll-top-btn {
      position: fixed;
      bottom: 32px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--main-purple);
      color: var(--white);
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(107,56,163,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.2s;
      z-index: 500;
    }
    .scroll-top-btn.visible { opacity: 1; pointer-events: auto; }
    .scroll-top-btn:hover { transform: translateY(-3px); }

    footer {
      padding: 60px 0;
      text-align: center;
      background: #f0eaf8;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      .content-area { padding: 0 16px 80px; }
      .doc-card { flex-direction: column; align-items: flex-start; }
      .pw-box { padding: 40px 28px; }
      .chat-area, .upload-area { padding: 22px 18px; }
      .scroll-top-btn { bottom: 20px; right: 16px; }
    }
  </style>
</head>
<body>

  <!-- パスワード画面 -->
  <div id="password-screen">
    <div class="pw-box">
      <div class="pw-logo">✦</div>
      <div class="pw-sub">…</div>
      <input type="password" class="pw-input" id="pw-input" placeholder="*" />
      <button class="pw-btn" id="pw-btn">▶</button>
    </div>
  </div>

  <!-- メインコンテンツ -->
  <div id="secret-content">

    <nav>
      <div class="nav-left">
        <a href="index.html" class="logo-container">
          <img src="https://raw.githubusercontent.com/YukaKaminashi/Stars-in-the-Sky/main/logo.hoshinosora.webp" alt="星ノ空" class="nav-logo-img" />
          <span class="logo-text">星ノ空</span>
        </a>
        <span class="nav-label">✦</span>
      </div>
      <a href="members.html" class="btn-back-nav">← 戻る</a>
    </nav>

    <div class="page-header">
      <span class="section-label">Secret</span>
      <h1 class="shippori">椿の秘密基地</h1>
    </div>

    <div class="content-area">

      <!-- チャット -->
      <div class="chat-area">
        <div class="chat-toolbar">
          <span class="chat-toolbar-title">チャット</span>
          <button class="chat-refresh-btn" id="chat-refresh-btn">↻ 更新</button>
        </div>
        <div class="chat-list" id="chat-list">
          <p class="chat-empty">読み込み中...</p>
        </div>
        <div class="chat-form">
          <input type="text" class="form-input" id="chat-name" placeholder="名前" maxlength="30" style="margin-bottom:0;" />
          <textarea class="form-input" id="chat-text" placeholder="メッセージを入力..." maxlength="400" style="resize:vertical; min-height:70px; line-height:1.65; margin-bottom:0;"></textarea>
          <button class="chat-submit-btn" id="chat-submit-btn">送信する</button>
        </div>
      </div>

      <!-- 資料 -->
      <div style="margin-bottom: 48px;">
        <div class="section-heading">資料</div>
        <div class="doc-list" id="doc-list">
          <div class="loading-area"><div class="loading-spinner"></div></div>
        </div>
      </div>

      <!-- アップロードフォーム -->
      <div class="upload-area">
        <div class="section-heading">資料を追加</div>
        <input type="text" class="form-input" id="doc-title" placeholder="タイトル" maxlength="100" />
        <div class="file-pick-row">
          <input type="file" id="doc-file" style="display:none;" accept=".pdf,.pptx,.ppt,.xlsx,.xls,.docx,.doc,.png,.jpg,.jpeg,.gif,.zip,.txt" />
          <button type="button" class="file-pick-btn" onclick="document.getElementById('doc-file').click()">↑ ファイルを選択</button>
          <span class="file-pick-info" id="doc-file-info">未選択</span>
        </div>
        <div class="or-divider"><span>または</span></div>
        <input type="url" class="form-input" id="doc-link" placeholder="Google Drive URL (https://...)" />
        <input type="text" class="form-input" id="doc-date" placeholder="日付 (例: 2026.04.15)" maxlength="20" />
        <button class="submit-btn" id="doc-submit">追加する ✦</button>
      </div>

    </div>

    <footer>
      <div style="max-width:860px; margin:0 auto; padding:0 30px;">
        <p style="font-family:var(--font-mincho); font-size:1.1rem; color:var(--main-purple); font-weight:800; margin-bottom:8px;">星ノ空</p>
        <p>信長の野望 真戦 S102〜S107</p>
        <p style="margin-top:24px; opacity:0.5; font-size:0.8rem;">&copy; 星ノ空 All Rights Reserved.</p>
      </div>
    </footer>

  </div><!-- /secret-content -->

  <!-- スクロールトップボタン -->
  <button class="scroll-top-btn" id="scroll-top-btn" title="トップへ戻る">↑</button>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwJBQ897qqOhTjvLeqRcCTSFllFgKOHAGQwtSXJ38hZey4NXTlBYD1ZpMWvvgNpj_BZ0w/exec';
    const SECRET_PASSWORD = 'baki';
    const SESSION_KEY = 'hoshinosora_secret';
    const SECRET_CAT = '椿の秘密基地';

    // ════════════════════════════════════════
    //  認証
    // ════════════════════════════════════════
    function isAuthed() {
      return sessionStorage.getItem(SESSION_KEY) === 'ok';
    }

    function showContent() {
      document.getElementById('password-screen').style.display = 'none';
      document.getElementById('secret-content').style.display = 'block';
      loadDocs();
      loadChat();
    }

    if (isAuthed()) {
      showContent();
    }

    document.getElementById('pw-btn').addEventListener('click', () => {
      if (document.getElementById('pw-input').value === SECRET_PASSWORD) {
        sessionStorage.setItem(SESSION_KEY, 'ok');
        showContent();
      } else {
        // 静かに何もしない（エラー表示なし）
        document.getElementById('pw-input').value = '';
      }
    });
    document.getElementById('pw-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('pw-btn').click();
    });

    // ════════════════════════════════════════
    //  資料
    // ════════════════════════════════════════
    async function loadDocs() {
      const container = document.getElementById('doc-list');
      try {
        const res = await fetch(GAS_URL + '?action=getMembers&category=' + encodeURIComponent(SECRET_CAT));
        const items = await res.json();
        if (!Array.isArray(items) || items.length === 0) {
          container.innerHTML = '<p class="empty-msg">資料はまだありません。</p>';
          return;
        }
        container.innerHTML = items.map(doc => `
          <div class="doc-card">
            <div class="doc-info">
              <div class="doc-title">${escHtml(doc.title)}</div>
              <div class="doc-date">${escHtml(String(doc.date))}</div>
            </div>
            <a href="${escAttr(doc.link)}" target="_blank" rel="noopener" class="btn-drive">Drive で開く →</a>
          </div>
        `).join('');
      } catch {
        container.innerHTML = '<p class="empty-msg">読み込みに失敗しました。</p>';
      }
    }

    // ファイル選択時にファイル名を表示
    document.getElementById('doc-file').addEventListener('change', function() {
      const file = this.files[0];
      const info = document.getElementById('doc-file-info');
      if (file) {
        const size = file.size > 1024 * 1024
          ? (file.size / 1024 / 1024).toFixed(1) + ' MB'
          : Math.ceil(file.size / 1024) + ' KB';
        info.textContent = `${file.name}（${size}）`;
      } else {
        info.textContent = '未選択';
      }
    });

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('doc-submit').addEventListener('click', async () => {
      const title = document.getElementById('doc-title').value.trim();
      const date = document.getElementById('doc-date').value.trim();
      const fileInput = document.getElementById('doc-file');
      const file = fileInput.files[0];
      let link = document.getElementById('doc-link').value.trim();

      if (!title || !date) { alert('タイトルと日付を入力してください。'); return; }
      if (!file && !link) { alert('ファイルを選択するか、URLを入力してください。'); return; }

      const btn = document.getElementById('doc-submit');
      btn.disabled = true;
      try {
        // ファイルが選択されていたらDriveにアップロード
        if (file) {
          btn.textContent = 'アップロード中...';
          const base64 = await fileToBase64(file);
          const uploadRes = await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action: 'uploadFile', fileName: file.name, mimeType: file.type || 'application/octet-stream', base64 })
          });
          const uploadResult = await uploadRes.json();
          if (!uploadResult.success) throw new Error(uploadResult.error || 'upload failed');
          link = uploadResult.url;
        }

        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'saveMember', category: SECRET_CAT, title, link, date })
        });
        const result = await res.json();
        if (result.success) {
          document.getElementById('doc-title').value = '';
          document.getElementById('doc-link').value = '';
          document.getElementById('doc-date').value = '';
          fileInput.value = '';
          document.getElementById('doc-file-info').textContent = '未選択';
          loadDocs();
        } else { alert('追加に失敗しました。'); }
      } catch { alert('追加に失敗しました。'); }
      btn.disabled = false;
      btn.textContent = '追加する ✦';
    });

    // ════════════════════════════════════════
    //  チャット
    // ════════════════════════════════════════
    let chatPollTimer = null;

    async function loadChat() {
      const list = document.getElementById('chat-list');
      try {
        const res = await fetch(GAS_URL + '?action=getChat');
        renderChat(await res.json());
      } catch {
        list.innerHTML = '<p class="chat-empty">読み込みに失敗しました。</p>';
      }
      clearInterval(chatPollTimer);
      chatPollTimer = setInterval(async () => {
        try {
          const res = await fetch(GAS_URL + '?action=getChat');
          renderChat(await res.json());
        } catch {}
      }, 30000);
    }

    function renderChat(items) {
      const list = document.getElementById('chat-list');
      if (!Array.isArray(items) || items.length === 0) {
        list.innerHTML = '<p class="chat-empty">まだメッセージはありません。最初のメッセージを送ってみよう！</p>';
        return;
      }
      list.innerHTML = items.map(m => `
        <div class="chat-msg">
          <div class="chat-msg-body">
            <div class="chat-msg-name">${escHtml(m.name)}</div>
            <div class="chat-msg-text">${escHtml(m.text)}</div>
          </div>
          <div class="chat-msg-meta">
            <span class="chat-msg-date">${escHtml(String(m.date).slice(5, 16))}</span>
            <button class="chat-delete-btn" onclick="deleteChatMsg('${escHtml(String(m.id))}')">削除</button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('chat-refresh-btn').addEventListener('click', loadChat);

    document.getElementById('chat-submit-btn').addEventListener('click', async () => {
      const name = document.getElementById('chat-name').value.trim();
      const text = document.getElementById('chat-text').value.trim();
      if (!name || !text) { alert('名前とメッセージを入力してください。'); return; }

      const btn = document.getElementById('chat-submit-btn');
      btn.disabled = true;
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'saveChat', name, text })
        });
        const result = await res.json();
        if (result.success) {
          document.getElementById('chat-text').value = '';
          loadChat();
        } else { alert('送信に失敗しました。'); }
      } catch { alert('送信に失敗しました。'); }
      btn.disabled = false;
    });

    async function deleteChatMsg(id) {
      if (!confirm('このメッセージを削除しますか？')) return;
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'deleteChat', id })
        });
        const result = await res.json();
        if (result.success) loadChat();
      } catch { alert('削除に失敗しました。'); }
    }

    // ════════════════════════════════════════
    //  ユーティリティ
    // ════════════════════════════════════════
    function escHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function escAttr(str) {
      const s = String(str || '').trim();
      if (/^javascript:/i.test(s)) return '#';
      return s.replace(/"/g, '&quot;');
    }

    // ── スクロールトップ ──
    const scrollTopBtn = document.getElementById('scroll-top-btn');
    window.addEventListener('scroll', () => {
      scrollTopBtn.classList.toggle('visible', window.scrollY > 300);
    });
    scrollTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
