<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ブログ | 星ノ空</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700;800&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-color: #FFFDF5;
      --main-purple: #6B38A3;
      --accent-yellow: #FFD700;
      --purple-soft: #F5EFFF;
      --text-dark: #332244;
      --text-muted: #665577;
      --white: #ffffff;
      --font-mincho: 'Shippori Mincho', serif;
      --font-gothic: 'Zen Kaku Gothic New', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg-color);
      color: var(--text-dark);
      font-family: var(--font-gothic);
      line-height: 1.8;
    }

    /* ── ナビ ── */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      height: 70px;
      background: rgba(255,253,245,0.95);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(107,56,163,0.08);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5vw;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo-container {
      display: flex;
      align-items: center;
      text-decoration: none;
      gap: 12px;
    }
    .nav-logo-img { height: 32px; width: auto; }
    .logo-text {
      font-family: var(--font-mincho);
      font-weight: 800;
      font-size: 1.3rem;
      color: var(--main-purple);
      letter-spacing: 0.1em;
    }
    .nav-blog-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
    }
    .btn-write {
      padding: 8px 20px;
      background: var(--main-purple);
      color: var(--white);
      text-decoration: none;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      transition: all 0.3s;
    }
    .btn-write:hover {
      background: var(--accent-yellow);
      color: var(--main-purple);
    }

    /* ── ページヘッダー ── */
    .page-header {
      padding: 130px 30px 60px;
      text-align: center;
    }
    .page-header .section-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--main-purple);
      text-transform: uppercase;
      border: 1px solid rgba(107,56,163,0.3);
      padding: 6px 18px;
      border-radius: 100px;
      margin-bottom: 20px;
    }
    .page-header h1 {
      font-family: var(--font-mincho);
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      color: var(--text-dark);
    }

    /* ── フィルタータブ ── */
    .filter-area {
      max-width: 900px;
      margin: 0 auto 40px;
      padding: 0 30px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 8px 20px;
      border-radius: 100px;
      border: 1.5px solid #e0d8f0;
      background: var(--white);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-family: var(--font-gothic);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover { border-color: var(--main-purple); color: var(--main-purple); }
    .filter-btn.active {
      background: var(--main-purple);
      border-color: var(--main-purple);
      color: var(--white);
    }

    /* ── 投稿一覧 ── */
    #post-list {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 30px 100px;
    }

    .post-card {
      background: var(--white);
      border-radius: 20px;
      padding: 28px 36px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(107,56,163,0.06);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      border-left: 4px solid var(--main-purple);
      display: block;
      text-decoration: none;
      color: inherit;
    }
    .post-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(107,56,163,0.12);
    }
    .post-card[data-group="はなたれパンダ"] { border-left-color: #E75480; }
    .post-card[data-group="たまねぎ"] { border-left-color: #2E8B57; }
    .post-card[data-group="こぐま"] { border-left-color: #D2691E; }
    .post-card[data-group="国主"] { border-left-color: #B8860B; }

    .post-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .post-group-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 100px;
      background: var(--purple-soft);
      color: var(--main-purple);
      letter-spacing: 0.05em;
    }
    .post-card[data-group="はなたれパンダ"] .post-group-badge {
      background: #ffe0eb; color: #E75480;
    }
    .post-card[data-group="たまねぎ"] .post-group-badge {
      background: #e0f5e9; color: #2E8B57;
    }
    .post-card[data-group="こぐま"] .post-group-badge {
      background: #f5ede0; color: #D2691E;
    }
    .post-card[data-group="国主"] .post-group-badge {
      background: #FFF3CD; color: #B8860B;
    }
    .post-author { font-size: 0.9rem; font-weight: 700; color: var(--text-dark); }
    .post-date { font-size: 0.8rem; color: var(--text-muted); margin-left: auto; }

    .post-title {
      font-family: var(--font-mincho);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 8px;
      line-height: 1.5;
    }
    .post-excerpt {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.7;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }
    .post-readmore {
      display: inline-block;
      margin-top: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--main-purple);
      letter-spacing: 0.1em;
    }

    /* ── 記事詳細 ── */
    #post-detail {
      display: none;
      max-width: 760px;
      margin: 0 auto;
      padding: 0 30px 100px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 100px 0 40px;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--main-purple); }

    .detail-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .detail-title {
      font-family: var(--font-mincho);
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 32px;
      color: var(--text-dark);
    }

    /* Quill で生成されたコンテンツのスタイル */
    .detail-content {
      font-size: 1rem;
      line-height: 1.9;
      color: var(--text-dark);
    }
    .detail-content h2 {
      font-family: var(--font-mincho);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--main-purple);
      margin: 2em 0 0.8em;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--purple-soft);
    }
    .detail-content h3 {
      font-family: var(--font-mincho);
      font-size: 1.2rem;
      font-weight: 700;
      margin: 1.8em 0 0.6em;
    }
    .detail-content p { margin-bottom: 1em; }
    .detail-content img {
      max-width: 100%;
      border-radius: 12px;
      margin: 1.5em 0;
      box-shadow: 0 8px 30px rgba(107,56,163,0.1);
    }
    .detail-content ul, .detail-content ol {
      padding-left: 1.5em;
      margin-bottom: 1em;
    }
    .detail-content li { margin-bottom: 0.4em; }
    .detail-content a { color: var(--main-purple); }
    .detail-content .ql-align-center { text-align: center; }
    .detail-content .ql-align-right { text-align: right; }

    /* ── いいねエリア ── */
    .like-area {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid var(--purple-soft);
    }
    .like-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border-radius: 100px;
      border: 2px solid #e0d8f0;
      background: var(--white);
      color: var(--text-muted);
      font-size: 0.9rem;
      font-family: var(--font-gothic);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
      user-select: none;
    }
    .like-btn:hover:not(:disabled) {
      border-color: var(--main-purple);
      color: var(--main-purple);
    }
    .like-btn.liked {
      background: var(--main-purple);
      border-color: var(--main-purple);
      color: var(--white);
    }
    .like-btn:disabled {
      cursor: default;
    }
    .like-count {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* ── コメント欄 ── */
    .comment-section {
      margin-top: 48px;
      padding-top: 36px;
      border-top: 1px solid var(--purple-soft);
    }
    .comment-heading {
      font-family: var(--font-mincho);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .comment-count-badge {
      font-family: var(--font-gothic);
      font-size: 0.8rem;
      font-weight: 700;
      background: var(--purple-soft);
      color: var(--main-purple);
      padding: 2px 10px;
      border-radius: 100px;
    }

    /* コメントカード */
    .comment-card {
      background: var(--white);
      border-radius: 14px;
      padding: 18px 22px;
      margin-bottom: 12px;
      box-shadow: 0 2px 10px rgba(107,56,163,0.05);
    }
    .comment-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .comment-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--main-purple);
    }
    .comment-date {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-left: auto;
    }
    .comment-text {
      font-size: 0.92rem;
      line-height: 1.75;
      color: var(--text-dark);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .reply-toggle-btn {
      margin-top: 10px;
      background: none;
      border: none;
      font-size: 0.8rem;
      font-family: var(--font-gothic);
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      transition: color 0.2s;
    }
    .reply-toggle-btn:hover { color: var(--main-purple); }

    /* 返信カード */
    .replies-area {
      margin-top: 10px;
      padding-left: 16px;
      border-left: 3px solid var(--purple-soft);
    }
    .reply-card {
      padding: 12px 16px;
      margin-bottom: 8px;
      background: var(--bg-color);
      border-radius: 10px;
    }
    .reply-card:last-of-type { margin-bottom: 0; }
    .reply-card .comment-name { font-size: 0.85rem; }
    .reply-card .comment-text { font-size: 0.88rem; }

    /* インライン返信フォーム */
    .reply-form {
      margin-top: 10px;
      padding: 14px 16px;
      background: var(--bg-color);
      border-radius: 10px;
      display: none;
    }
    .reply-form.open { display: block; }

    /* コメント投稿フォーム */
    .comment-form-area {
      margin-top: 32px;
      background: var(--white);
      border-radius: 16px;
      padding: 24px 28px;
      box-shadow: 0 2px 10px rgba(107,56,163,0.05);
    }
    .comment-form-title {
      font-family: var(--font-mincho);
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 16px;
    }
    .comment-input {
      width: 100%;
      padding: 11px 16px;
      border: 1.5px solid #e0d8f0;
      border-radius: 10px;
      font-size: 0.92rem;
      font-family: var(--font-gothic);
      color: var(--text-dark);
      background: var(--white);
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 10px;
    }
    .comment-input:focus { border-color: var(--main-purple); }
    textarea.comment-input {
      resize: vertical;
      min-height: 90px;
      line-height: 1.7;
    }
    .comment-submit-btn {
      padding: 10px 28px;
      background: var(--main-purple);
      color: var(--white);
      border: none;
      border-radius: 100px;
      font-size: 0.88rem;
      font-family: var(--font-gothic);
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .comment-submit-btn:hover { background: #5a2d8a; }
    .comment-submit-btn:disabled { background: #ccc; cursor: not-allowed; }
    .comment-empty {
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 20px 0;
    }

    /* ── ローディング・空状態 ── */
    .loading-area, .empty-area {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--purple-soft);
      border-top-color: var(--main-purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      padding: 60px 0;
      text-align: center;
      background: #f0eaf8;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      .post-card { padding: 20px 18px; }
      #post-list, #post-detail { padding: 0 16px 80px; }
      .filter-area { padding: 0 16px; }
    }
  </style>
</head>
<body>

  <!-- ナビゲーション -->
  <nav>
    <div class="nav-left">
      <a href="index.html" class="logo-container">
        <img src="https://raw.githubusercontent.com/YukaKaminashi/Stars-in-the-Sky/main/logo.hoshinosora.webp" alt="星ノ空" class="nav-logo-img" />
        <span class="logo-text">星ノ空</span>
      </a>
      <span class="nav-blog-label">BLOG</span>
    </div>
    <a href="admin.html" class="btn-write">✦ 投稿する</a>
  </nav>

  <!-- ページヘッダー -->
  <div class="page-header" id="blog-header">
    <span class="section-label">Blog</span>
    <h1 class="shippori">みんなの声</h1>
  </div>

  <!-- フィルタータブ -->
  <div class="filter-area" id="filter-area">
    <button class="filter-btn active" data-filter="all">すべて</button>
    <button class="filter-btn" data-filter="広報課">広報課</button>
    <button class="filter-btn" data-filter="はなたれパンダ">はなたれパンダ</button>
    <button class="filter-btn" data-filter="たまねぎ">たまねぎ</button>
    <button class="filter-btn" data-filter="こぐま">こぐま</button>
    <button class="filter-btn" data-filter="国主">国主</button>
  </div>

  <!-- 投稿一覧 -->
  <div id="post-list">
    <div class="loading-area">
      <div class="loading-spinner"></div>
      <p>読み込み中...</p>
    </div>
  </div>

  <!-- 記事詳細 -->
  <div id="post-detail">
    <div class="back-btn" id="back-btn">← 一覧に戻る</div>
    <div class="detail-meta" id="detail-meta"></div>
    <h1 class="detail-title" id="detail-title"></h1>
    <div class="detail-content" id="detail-content"></div>
    <div class="like-area" id="like-area" style="display:none;">
      <button class="like-btn" id="like-btn">
        <span id="like-icon">♡</span>
        <span>いいね</span>
      </button>
      <span class="like-count" id="like-count"></span>
    </div>

    <!-- コメント欄 -->
    <div class="comment-section" id="comment-section" style="display:none;">
      <div class="comment-heading">
        コメント
        <span class="comment-count-badge" id="comment-count-badge"></span>
      </div>
      <div id="comment-list"></div>
      <div class="comment-form-area">
        <div class="comment-form-title">コメントを書く</div>
        <input type="text" class="comment-input" id="new-comment-name" placeholder="名前" maxlength="30" />
        <textarea class="comment-input" id="new-comment-text" placeholder="コメントを入力..." maxlength="500"></textarea>
        <button class="comment-submit-btn" id="new-comment-submit">投稿する</button>
      </div>
    </div>
  </div>

  <footer>
    <div style="max-width:900px; margin:0 auto; padding:0 30px;">
      <p class="shippori" style="font-size:1.2rem; color:var(--main-purple); font-weight:800; margin-bottom:8px;">星ノ空</p>
      <p>信長の野望 真戦 S102〜S107</p>
      <p style="margin-top:30px; opacity:0.5; font-size:0.8rem;">&copy; 星ノ空 All Rights Reserved.</p>
    </div>
  </footer>

  <script>
    // ════════════════════════════════════════
    //  設定
    // ════════════════════════════════════════
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwJBQ897qqOhTjvLeqRcCTSFllFgKOHAGQwtSXJ38hZey4NXTlBYD1ZpMWvvgNpj_BZ0w/exec';

    // ════════════════════════════════════════
    //  状態管理
    // ════════════════════════════════════════
    let allPosts = [];
    let currentFilter = 'all';
    let currentPostId = null;

    // ════════════════════════════════════════
    //  いいね：LocalStorage管理
    // ════════════════════════════════════════
    const LIKES_KEY = 'hoshinosora_likes';

    function getLikedSet() {
      try { return new Set(JSON.parse(localStorage.getItem(LIKES_KEY)) || []); }
      catch { return new Set(); }
    }

    function saveLikedSet(set) {
      localStorage.setItem(LIKES_KEY, JSON.stringify([...set]));
    }

    function hasLiked(postId) {
      return getLikedSet().has(String(postId));
    }

    function markLiked(postId) {
      const set = getLikedSet();
      set.add(String(postId));
      saveLikedSet(set);
    }

    // ════════════════════════════════════════
    //  初期化
    // ════════════════════════════════════════
    async function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const postId = urlParams.get('id');
      if (postId) {
        await loadSinglePost(postId);
      } else {
        await loadPostList();
      }
    }

    // ════════════════════════════════════════
    //  投稿一覧取得・表示
    // ════════════════════════════════════════
    async function loadPostList() {
      document.getElementById('post-list').style.display = 'block';
      document.getElementById('post-detail').style.display = 'none';
      document.getElementById('filter-area').style.display = 'flex';
      document.getElementById('blog-header').style.display = 'block';

      try {
        const res = await fetch(GAS_URL + '?action=getPosts');
        allPosts = await res.json();
        renderPostList(allPosts);
      } catch (err) {
        document.getElementById('post-list').innerHTML =
          '<div class="empty-area"><p>記事の読み込みに失敗しました。</p></div>';
        console.error(err);
      }
    }

    function renderPostList(posts) {
      const filtered = currentFilter === 'all'
        ? posts
        : posts.filter(p => p.group === currentFilter);

      const container = document.getElementById('post-list');

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-area"><p>まだ記事がありません。</p></div>';
        return;
      }

      container.innerHTML = filtered.map(post => `
        <a class="post-card" data-group="${escHtml(post.group)}" href="blog.html?id=${post.id}">
          <div class="post-meta">
            <span class="post-group-badge">${escHtml(post.group)}</span>
            <span class="post-author">${escHtml(post.author)}</span>
            <span class="post-date">${escHtml(post.date)}</span>
          </div>
          <div class="post-title">${escHtml(post.title)}</div>
          <div class="post-excerpt">${escHtml(post.excerpt || '')}</div>
          <span class="post-readmore">続きを読む →</span>
        </a>
      `).join('');
    }

    // ════════════════════════════════════════
    //  記事1件取得・表示
    // ════════════════════════════════════════
    async function loadSinglePost(id) {
      currentPostId = id;
      document.getElementById('post-list').style.display = 'none';
      document.getElementById('filter-area').style.display = 'none';
      document.getElementById('blog-header').style.display = 'none';
      document.getElementById('post-detail').style.display = 'block';
      document.getElementById('like-area').style.display = 'none';

      document.getElementById('detail-content').innerHTML =
        '<div class="loading-area"><div class="loading-spinner"></div><p>読み込み中...</p></div>';

      try {
        const res = await fetch(GAS_URL + '?action=getPost&id=' + encodeURIComponent(id));
        const post = await res.json();

        if (post.error) throw new Error(post.error);

        document.title = post.title + ' | 星ノ空ブログ';

        document.getElementById('detail-meta').innerHTML = `
          <span class="post-group-badge" style="${groupStyle(post.group)}">${escHtml(post.group)}</span>
          <span style="font-weight:700;">${escHtml(post.author)}</span>
          <span style="color:var(--text-muted); font-size:0.85rem;">${escHtml(post.date)}</span>
        `;
        document.getElementById('detail-title').textContent = post.title;
        document.getElementById('detail-content').innerHTML = post.content;

        // いいねエリア表示
        setupLikeArea(id, post.likes);

        // コメント欄表示
        loadComments(id);

      } catch (err) {
        document.getElementById('detail-content').innerHTML =
          '<div class="empty-area"><p>記事が見つかりませんでした。</p></div>';
        console.error(err);
      }
    }

    // ════════════════════════════════════════
    //  いいね機能
    // ════════════════════════════════════════
    function setupLikeArea(postId, initialLikes) {
      const likeArea = document.getElementById('like-area');
      const likeBtn = document.getElementById('like-btn');
      const likeIcon = document.getElementById('like-icon');
      const likeCount = document.getElementById('like-count');

      const liked = hasLiked(postId);
      const count = Number(initialLikes) || 0;

      updateLikeUI(liked, count);
      likeArea.style.display = 'flex';

      likeBtn.onclick = async () => {
        if (hasLiked(postId)) return;

        likeBtn.disabled = true;
        try {
          const res = await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action: 'likePost', id: postId })
          });
          const result = await res.json();
          if (result.success) {
            markLiked(postId);
            updateLikeUI(true, result.likes);
          }
        } catch (e) {
          console.error(e);
        } finally {
          likeBtn.disabled = false;
        }
      };
    }

    function updateLikeUI(liked, count) {
      const likeBtn = document.getElementById('like-btn');
      const likeIcon = document.getElementById('like-icon');
      const likeCount = document.getElementById('like-count');

      if (liked) {
        likeBtn.classList.add('liked');
        likeIcon.textContent = '♥';
        likeBtn.disabled = true;
      } else {
        likeBtn.classList.remove('liked');
        likeIcon.textContent = '♡';
        likeBtn.disabled = false;
      }
      likeCount.textContent = count > 0 ? `${count} いいね` : '';
    }

    // ════════════════════════════════════════
    //  コメント機能
    // ════════════════════════════════════════
    async function loadComments(postId) {
      const section = document.getElementById('comment-section');
      const list = document.getElementById('comment-list');
      section.style.display = 'block';
      list.innerHTML = '<div style="color:var(--text-muted);font-size:0.9rem;padding:16px 0;">読み込み中...</div>';

      try {
        const res = await fetch(GAS_URL + '?action=getComments&postId=' + encodeURIComponent(postId));
        const comments = await res.json();
        renderComments(comments, postId);
      } catch (e) {
        list.innerHTML = '<p style="color:var(--text-muted);font-size:0.9rem;">コメントの読み込みに失敗しました。</p>';
      }

      // 新規コメント投稿
      document.getElementById('new-comment-submit').onclick = async () => {
        const name = document.getElementById('new-comment-name').value.trim();
        const text = document.getElementById('new-comment-text').value.trim();
        if (!name || !text) { alert('名前とコメントを入力してください。'); return; }

        const btn = document.getElementById('new-comment-submit');
        btn.disabled = true;
        try {
          const res = await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action: 'saveComment', postId, parentId: '', name, text })
          });
          const result = await res.json();
          if (result.success) {
            document.getElementById('new-comment-name').value = '';
            document.getElementById('new-comment-text').value = '';
            // 再読み込み
            const res2 = await fetch(GAS_URL + '?action=getComments&postId=' + encodeURIComponent(postId));
            renderComments(await res2.json(), postId);
          }
        } catch (e) { alert('投稿に失敗しました。'); }
        btn.disabled = false;
      };
    }

    function renderComments(comments, postId) {
      const list = document.getElementById('comment-list');
      const badge = document.getElementById('comment-count-badge');

      // 総数（コメント＋返信）
      const total = comments.reduce((n, c) => n + 1 + (c.replies ? c.replies.length : 0), 0);
      badge.textContent = total > 0 ? total : '';

      if (!comments || comments.length === 0) {
        list.innerHTML = '<p class="comment-empty">まだコメントはありません。最初のコメントを書いてみましょう！</p>';
        return;
      }

      list.innerHTML = comments.map(c => {
        const repliesHtml = (c.replies || []).map(r => `
          <div class="reply-card">
            <div class="comment-header">
              <span class="comment-name">↳ ${escHtml(r.name)}</span>
              <span class="comment-date">${escHtml(r.date)}</span>
            </div>
            <div class="comment-text">${escHtml(r.text)}</div>
          </div>
        `).join('');

        return `
          <div class="comment-card" id="comment-${c.id}">
            <div class="comment-header">
              <span class="comment-name">${escHtml(c.name)}</span>
              <span class="comment-date">${escHtml(c.date)}</span>
            </div>
            <div class="comment-text">${escHtml(c.text)}</div>
            <button class="reply-toggle-btn" onclick="toggleReplyForm('${c.id}')">返信する</button>
            <div class="reply-form" id="reply-form-${c.id}">
              <input type="text" class="comment-input" id="reply-name-${c.id}" placeholder="名前" maxlength="30" style="margin-bottom:8px;" />
              <textarea class="comment-input" id="reply-text-${c.id}" placeholder="返信を入力..." maxlength="500" style="min-height:70px;"></textarea>
              <div style="display:flex;gap:8px;margin-top:6px;">
                <button class="comment-submit-btn" onclick="submitReply('${c.id}', '${postId}')">返信する</button>
                <button class="reply-toggle-btn" style="margin-top:0;" onclick="toggleReplyForm('${c.id}')">キャンセル</button>
              </div>
            </div>
            ${c.replies && c.replies.length > 0 ? `<div class="replies-area">${repliesHtml}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    function toggleReplyForm(commentId) {
      const form = document.getElementById('reply-form-' + commentId);
      form.classList.toggle('open');
      if (form.classList.contains('open')) {
        form.querySelector('input').focus();
      }
    }

    async function submitReply(parentId, postId) {
      const name = document.getElementById('reply-name-' + parentId).value.trim();
      const text = document.getElementById('reply-text-' + parentId).value.trim();
      if (!name || !text) { alert('名前と返信内容を入力してください。'); return; }

      const btn = document.querySelector(`#reply-form-${parentId} .comment-submit-btn`);
      if (btn) { btn.disabled = true; btn.textContent = '送信中...'; }

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'saveComment', postId, parentId, name, text })
        });
        const result = await res.json();
        if (result.success) {
          const res2 = await fetch(GAS_URL + '?action=getComments&postId=' + encodeURIComponent(postId));
          renderComments(await res2.json(), postId);
        }
      } catch (e) {
        alert('返信に失敗しました。');
        if (btn) { btn.disabled = false; btn.textContent = '返信する'; }
      }
    }

    // ════════════════════════════════════════
    //  フィルター
    // ════════════════════════════════════════
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderPostList(allPosts);
      });
    });

    // ════════════════════════════════════════
    //  「一覧に戻る」ボタン
    // ════════════════════════════════════════
    document.getElementById('back-btn').addEventListener('click', () => {
      history.pushState({}, '', 'blog.html');
      loadPostList();
    });

    // ════════════════════════════════════════
    //  ユーティリティ
    // ════════════════════════════════════════
    function escHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function groupStyle(group) {
      const styles = {
        '広報課': 'background:#F5EFFF; color:#6B38A3;',
        'はなたれパンダ': 'background:#ffe0eb; color:#E75480;',
        'たまねぎ': 'background:#e0f5e9; color:#2E8B57;',
        'こぐま': 'background:#f5ede0; color:#D2691E;',
        '国主': 'background:#FFF3CD; color:#B8860B;'
      };
      return styles[group] || 'background:#F5EFFF; color:#6B38A3;';
    }

    init();
  </script>
</body>
</html>
