<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ブログ投稿 | 星ノ空</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700;800&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet" />
  <style>
    :root {
      --bg-color: #FFFDF5;
      --main-purple: #6B38A3;
      --accent-yellow: #FFD700;
      --purple-soft: #F5EFFF;
      --text-dark: #332244;
      --text-muted: #665577;
      --white: #ffffff;
      --font-mincho: 'Shippori Mincho', serif;
      --font-gothic: 'Zen Kaku Gothic New', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-color);
      color: var(--text-dark);
      font-family: var(--font-gothic);
      min-height: 100vh;
    }

    /* ── パスワード画面 ── */
    #password-screen {
      position: fixed;
      inset: 0;
      background: var(--bg-color);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .pw-box {
      background: var(--white);
      border-radius: 20px;
      padding: 50px 60px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(107,56,163,0.12);
      max-width: 400px;
      width: 90%;
    }
    .pw-logo {
      font-family: var(--font-mincho);
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--main-purple);
      margin-bottom: 8px;
    }
    .pw-sub {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 30px;
    }
    .pw-input {
      width: 100%;
      padding: 14px 20px;
      border: 2px solid var(--purple-soft);
      border-radius: 12px;
      font-size: 1rem;
      font-family: var(--font-gothic);
      outline: none;
      transition: border-color 0.3s;
      margin-bottom: 16px;
    }
    .pw-input:focus { border-color: var(--main-purple); }
    .pw-btn {
      width: 100%;
      padding: 14px;
      background: var(--main-purple);
      color: var(--white);
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-family: var(--font-gothic);
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    .pw-btn:hover { background: #5a2d8a; transform: translateY(-2px); }
    .pw-error {
      color: #e53e3e;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }

    /* ── 管理画面 ── */
    #admin-panel { display: none; }

    header.admin-header {
      background: var(--white);
      border-bottom: 1px solid var(--purple-soft);
      padding: 0 40px;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-logo {
      font-family: var(--font-mincho);
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--main-purple);
    }
    .header-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-left: 12px;
    }
    .btn-logout {
      font-size: 0.85rem;
      color: var(--text-muted);
      background: none;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 6px 16px;
      cursor: pointer;
      font-family: var(--font-gothic);
      transition: all 0.2s;
    }
    .btn-logout:hover { border-color: var(--main-purple); color: var(--main-purple); }

    .admin-body {
      max-width: 860px;
      margin: 40px auto;
      padding: 0 30px 80px;
    }

    .form-group { margin-bottom: 24px; }
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.05em;
    }
    .form-input, .form-select {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #e8e0f0;
      border-radius: 12px;
      font-size: 1rem;
      font-family: var(--font-gothic);
      color: var(--text-dark);
      background: var(--white);
      outline: none;
      transition: border-color 0.3s;
    }
    .form-input:focus, .form-select:focus { border-color: var(--main-purple); }
    .form-input.title-input {
      font-family: var(--font-mincho);
      font-size: 1.4rem;
      font-weight: 700;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    /* ── ファイルアップロード UI ── */
    .file-pick-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .file-pick-btn {
      padding: 9px 18px;
      border: 1.5px solid var(--main-purple);
      color: var(--main-purple);
      background: var(--white);
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: var(--font-gothic);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .file-pick-btn:hover { background: var(--purple-soft); }
    .file-pick-info {
      font-size: 0.8rem;
      color: var(--text-muted);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .or-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      color: var(--text-muted);
      font-size: 0.78rem;
    }
    .or-divider::before, .or-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e0d8f0;
    }

    /* ── Quill エディタカスタマイズ ── */
    .editor-wrapper {
      border: 2px solid #e8e0f0;
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.3s;
    }
    .editor-wrapper:focus-within { border-color: var(--main-purple); }
    .ql-toolbar.ql-snow {
      border: none;
      border-bottom: 1px solid #e8e0f0;
      background: #faf8ff;
      padding: 12px 16px;
    }
    .ql-container.ql-snow {
      border: none;
      font-family: var(--font-gothic);
      font-size: 1rem;
    }
    .ql-editor {
      min-height: 400px;
      padding: 24px;
      color: var(--text-dark);
      line-height: 1.9;
    }
    .ql-editor h2 {
      font-family: var(--font-mincho);
      color: var(--main-purple);
      font-size: 1.5rem;
      margin: 1.5em 0 0.5em;
    }
    .ql-editor h3 {
      font-family: var(--font-mincho);
      font-size: 1.2rem;
      margin: 1.2em 0 0.4em;
    }
    .ql-editor img {
      max-width: 100%;
      border-radius: 8px;
    }
    .ql-editor p { margin-bottom: 0.6em; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── タブ ── */
    .admin-tabs {
      display: flex;
      gap: 8px;
      margin: 0 0 0 24px;
    }
    .tab-btn {
      padding: 6px 18px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: none;
      font-family: var(--font-gothic);
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--main-purple);
      color: white;
      border-color: var(--main-purple);
    }

    /* ── ニュースフォーム ── */
    .news-form-row {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 12px;
      align-items: start;
      margin-bottom: 16px;
    }
    .news-existing {
      margin-top: 40px;
    }
    .news-existing-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }
    .news-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--white);
      border: 1px solid #e8e0f0;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .news-row-date { font-size: 0.8rem; color: var(--text-muted); flex-shrink: 0; }
    .news-row-badge {
      font-size: 0.72rem;
      background: var(--main-purple);
      color: white;
      padding: 2px 8px;
      border-radius: 100px;
      flex-shrink: 0;
    }
    .news-row-text { flex: 1; font-size: 0.9rem; }
    .btn-delete {
      flex-shrink: 0;
      background: none;
      border: 1px solid #ddd;
      color: #aaa;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-delete:hover { border-color: #e53e3e; color: #e53e3e; }

    /* 送信ボタン */
    .submit-area {
      text-align: right;
      margin-top: 32px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
    }
    #submit-msg {
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .btn-submit {
      padding: 16px 48px;
      background: var(--main-purple);
      color: var(--white);
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-family: var(--font-mincho);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 0.05em;
    }
    .btn-submit:hover {
      background: var(--accent-yellow);
      color: var(--main-purple);
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(255,215,0,0.3);
    }
    .btn-submit:disabled {
      background: #ccc;
      color: #888;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* 成功・失敗通知 */
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: 16px 32px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      z-index: 9999;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .toast.success { background: var(--main-purple); color: var(--white); }
    .toast.error { background: #e53e3e; color: var(--white); }

    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
      .admin-body { padding: 0 16px 60px; }

      header.admin-header {
        padding: 10px 16px;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
      }
      /* 1段目：ロゴ＋右ボタン群 */
      header.admin-header > div:first-child {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        min-height: 50px;
      }
      /* 2段目：タブを全幅に展開 */
      .admin-tabs {
        margin: 0;
        width: 100%;
        border-top: 1px solid var(--purple-soft);
        padding: 8px 0 4px;
        gap: 6px;
        flex-wrap: wrap;
      }
      .tab-btn {
        font-size: 0.78rem;
        padding: 6px 10px;
        flex: 1;
        text-align: center;
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>

  <!-- パスワード画面 -->
  <div id="password-screen">
    <div class="pw-box">
      <div class="pw-logo">星ノ空</div>
      <div class="pw-sub">ブログ投稿管理</div>
      <input type="password" class="pw-input" id="pw-input" placeholder="パスワードを入力" />
      <button class="pw-btn" id="pw-btn">ログイン</button>
      <div class="pw-error" id="pw-error">パスワードが違います</div>
      <a href="index.html" style="display:inline-block; margin-top:16px; font-size:0.85rem; color:var(--text-muted); text-decoration:none; border:1px solid #ddd; border-radius:8px; padding:6px 16px; transition:all 0.2s;" onmouseover="this.style.borderColor='var(--main-purple)';this.style.color='var(--main-purple)'" onmouseout="this.style.borderColor='#ddd';this.style.color='var(--text-muted)'">← ホームへ戻る</a>
    </div>
  </div>

  <!-- 管理画面 -->
  <div id="admin-panel">
    <header class="admin-header">
      <div style="display:flex; align-items:center;">
        <span class="header-logo">星ノ空</span>
        <div class="admin-tabs">
          <button class="tab-btn active" id="tab-blog" onclick="switchTab('blog')">ブログ投稿</button>
          <button class="tab-btn" id="tab-news" onclick="switchTab('news')">ニュース管理</button>
          <button class="tab-btn" id="tab-members" onclick="switchTab('members')">資料管理</button>
          <button class="tab-btn" id="tab-comments" onclick="switchTab('comments')">コメント管理</button>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <a href="index.html" style="font-size:0.85rem; color:var(--text-muted); text-decoration:none; border:1px solid #ddd; border-radius:8px; padding:6px 16px; transition:all 0.2s;" onmouseover="this.style.borderColor='var(--main-purple)';this.style.color='var(--main-purple)'" onmouseout="this.style.borderColor='#ddd';this.style.color='var(--text-muted)'">← ホームへ</a>
        <button class="btn-logout" id="btn-logout">ログアウト</button>
      </div>
    </header>

    <!-- ブログ投稿パネル -->
    <div id="panel-blog" class="admin-body">
      <div class="form-group">
        <label class="form-label">タイトル</label>
        <input type="text" class="form-input title-input" id="post-title" placeholder="記事のタイトルを入力" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">著者名</label>
          <input type="text" class="form-input" id="post-author" placeholder="名前を入力" />
        </div>
        <div class="form-group">
          <label class="form-label">グループ</label>
          <select class="form-select" id="post-group">
            <option value="広報課">広報課</option>
            <option value="はなたれパンダ">はなたれパンダ</option>
            <option value="たまねぎ">たまねぎ</option>
            <option value="こぐま">こぐま</option>
            <option value="国主">国主</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">本文</label>
        <div class="editor-wrapper">
          <div id="editor"></div>
        </div>
      </div>
      <div class="submit-area">
        <span id="submit-msg"></span>
        <button class="btn-submit" id="btn-submit">投稿する ✦</button>
      </div>
    </div>

    <!-- ニュース管理パネル -->
    <div id="panel-news" class="admin-body" style="display:none;">
      <div class="form-group">
        <label class="form-label">新しいお知らせを追加</label>
        <div class="news-form-row">
          <input type="date" class="form-input" id="news-date" />
          <select class="form-select" id="news-badge">
            <option value="運営">運営</option>
            <option value="Discord">Discord</option>
            <option value="イベント">イベント</option>
            <option value="お知らせ">お知らせ</option>
            <option value="更新">更新</option>
          </select>
        </div>
        <div class="news-form-row" style="grid-template-columns: 1fr;">
          <textarea class="form-input" id="news-text" rows="4" placeholder="お知らせの本文を入力（改行可）" style="resize: vertical; line-height: 1.7;"></textarea>
        </div>
        <div class="news-form-row" style="grid-template-columns: 1fr;">
          <input type="url" class="form-input" id="news-link" placeholder="リンクURL（任意）" />
        </div>
      </div>
      <div class="submit-area">
        <button class="btn-submit" id="btn-news-submit">追加する ✦</button>
      </div>
      <div class="news-existing">
        <div class="news-existing-title">現在のお知らせ一覧</div>
        <div id="news-list-admin">読み込み中...</div>
      </div>
    </div>

  <!-- 資料管理パネル -->
  <div id="panel-members" class="admin-body" style="display:none;">

      <!-- スケジュール管理 -->
      <div style="margin-bottom:48px;">
        <div class="form-label" style="font-size:1rem; margin-bottom:20px;">スケジュール管理</div>
        <div class="form-group">
          <label class="form-label">カテゴリ</label>
          <select class="form-select" id="sch-category">
            <option value="その他">その他</option>
            <option value="戦略・攻城">戦略・攻城</option>
            <option value="イベント">イベント</option>
            <option value="経営会議">経営会議</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">日付表示テキスト</label>
            <input type="text" class="form-input" id="sch-date" placeholder="例: 2026.05.10" />
          </div>
          <div class="form-group">
            <label class="form-label">内容</label>
            <input type="text" class="form-input" id="sch-text" placeholder="例: 第3回総務会" />
          </div>
        </div>
        <div class="submit-area">
          <button class="btn-submit" id="btn-sch-add">追加する ✦</button>
        </div>
        <div class="news-existing">
          <div class="news-existing-title">現在のスケジュール</div>
          <div id="sch-list-admin">読み込み中...</div>
        </div>
      </div>

      <hr style="border:none; border-top:1px solid var(--purple-soft); margin-bottom:48px;">

      <!-- 資料管理 -->
      <div>
        <div class="form-label" style="font-size:1rem; margin-bottom:20px;">資料管理</div>
        <div class="form-group">
          <label class="form-label">カテゴリ</label>
          <select class="form-select" id="doc-category">
            <option value="総則">総則</option>
            <option value="スライド資料">スライド資料</option>
            <option value="組織図">組織図</option>
            <option value="議事録">議事録</option>
            <option value="椿の秘密基地">椿の秘密基地</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">タイトル</label>
          <input type="text" class="form-input" id="doc-title" placeholder="資料のタイトル" />
        </div>
        <div class="form-group">
          <label class="form-label">ファイル / URL</label>
          <div class="file-pick-row">
            <input type="file" id="doc-file" style="display:none;" accept=".pdf,.pptx,.ppt,.xlsx,.xls,.docx,.doc,.png,.jpg,.jpeg,.gif,.zip,.txt" />
            <button type="button" class="file-pick-btn" onclick="document.getElementById('doc-file').click()">↑ ファイルを選択</button>
            <span class="file-pick-info" id="doc-file-info">未選択</span>
          </div>
          <div class="or-divider"><span>または</span></div>
          <input type="url" class="form-input" id="doc-link" placeholder="Google Drive URL (https://...)" />
        </div>
        <div class="form-group">
          <label class="form-label">日付</label>
          <input type="text" class="form-input" id="doc-date" placeholder="例: 2026.04.13" />
        </div>
        <div class="submit-area">
          <button class="btn-submit" id="btn-doc-add">追加する ✦</button>
        </div>
        <div class="news-existing">
          <div class="news-existing-title">現在の資料一覧</div>
          <div id="doc-list-admin">読み込み中...</div>
        </div>
      </div>

  </div>

  <!-- コメント管理パネル -->
  <div id="panel-comments" class="admin-body" style="display:none;">
    <div class="news-existing-title">コメント一覧（新しい順）</div>
    <div id="comment-list-admin">読み込み中...</div>
  </div>
  </div><!-- /#admin-panel -->

  <div class="toast" id="toast"></div>

  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <script>
    // ════════════════════════════════════════
    //  設定（変更が必要な箇所）
    // ════════════════════════════════════════
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwJBQ897qqOhTjvLeqRcCTSFllFgKOHAGQwtSXJ38hZey4NXTlBYD1ZpMWvvgNpj_BZ0w/exec';
    const BLOG_PASSWORD    = 'hoshinosorahoshinosora';
    const MANAGE_PASSWORD  = 'hoshinosoraadmin';
    const SESSION_KEY      = 'hoshinosora_admin'; // 値: 'blog' | 'admin'

    // ════════════════════════════════════════
    //  パスワード認証
    // ════════════════════════════════════════
    function getRole() {
      return sessionStorage.getItem(SESSION_KEY); // 'blog' | 'admin' | null
    }

    function login(password) {
      if (password === BLOG_PASSWORD) {
        sessionStorage.setItem(SESSION_KEY, 'blog');
        showAdminPanel('blog');
        return true;
      }
      if (password === MANAGE_PASSWORD) {
        sessionStorage.setItem(SESSION_KEY, 'admin');
        showAdminPanel('admin');
        return true;
      }
      return false;
    }

    function logout() {
      sessionStorage.removeItem(SESSION_KEY);
      document.getElementById('admin-panel').style.display = 'none';
      document.getElementById('password-screen').style.display = 'flex';
      document.getElementById('pw-input').value = '';
    }

    function showAdminPanel(role) {
      document.getElementById('password-screen').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';
      // ロールに応じてタブを切替
      const blogTabs    = ['blog'];
      const manageTabs  = ['news', 'members', 'comments'];
      if (role === 'blog') {
        blogTabs.forEach(t => document.getElementById('tab-' + t).style.display = '');
        manageTabs.forEach(t => document.getElementById('tab-' + t).style.display = 'none');
        switchTab('blog');
      } else {
        blogTabs.forEach(t => document.getElementById('tab-' + t).style.display = 'none');
        manageTabs.forEach(t => document.getElementById('tab-' + t).style.display = '');
        switchTab('news');
      }
    }

    // セッション確認
    const _role = getRole();
    if (_role) showAdminPanel(_role);

    document.getElementById('pw-btn').addEventListener('click', () => {
      const pw = document.getElementById('pw-input').value;
      const ok = login(pw);
      document.getElementById('pw-error').style.display = ok ? 'none' : 'block';
    });

    document.getElementById('pw-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('pw-btn').click();
    });

    document.getElementById('btn-logout').addEventListener('click', logout);

    // ════════════════════════════════════════
    //  Quill エディタ初期化
    // ════════════════════════════════════════
    const toolbarOptions = [
      [{ 'header': [2, 3, false] }],
      ['bold', 'italic', 'underline'],
      [{ 'list': 'ordered' }, { 'list': 'bullet' }],
      [{ 'align': [] }],
      ['image', 'link'],
      ['clean']
    ];

    const quill = new Quill('#editor', {
      theme: 'snow',
      modules: { toolbar: { container: toolbarOptions, handlers: { image: imageHandler } } },
      placeholder: '本文を入力してください...'
    });

    // ════════════════════════════════════════
    //  画像挿入（canvas圧縮・base64直接埋め込み）
    // ════════════════════════════════════════
    function imageHandler() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.click();

      input.onchange = () => {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const MAX_W = 800;
            let w = img.width, h = img.height;
            if (w > MAX_W) { h = Math.round(h * MAX_W / w); w = MAX_W; }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
            const range = quill.getSelection() || { index: quill.getLength() };
            quill.insertEmbed(range.index, 'image', dataUrl);
            quill.setSelection(range.index + 1);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      };
    }

    // ════════════════════════════════════════
    //  タブ切替
    // ════════════════════════════════════════
    function switchTab(tab) {
      ['blog','news','members','comments'].forEach(t => {
        document.getElementById('panel-' + t).style.display = tab === t ? 'block' : 'none';
        document.getElementById('tab-' + t).classList.toggle('active', tab === t);
      });
      if (tab === 'news')     loadNewsList();
      if (tab === 'members')  { loadSchList(); loadDocList(); }
      if (tab === 'comments') loadAllComments();
    }

    // ════════════════════════════════════════
    //  コメント管理
    // ════════════════════════════════════════
    async function loadAllComments() {
      const container = document.getElementById('comment-list-admin');
      container.innerHTML = '読み込み中...';
      try {
        const res = await fetch(GAS_URL + '?action=getAllComments');
        const items = await res.json();
        if (!Array.isArray(items) || items.length === 0) {
          container.innerHTML = '<p style="color:var(--text-muted);font-size:0.9rem;">コメントはまだありません。</p>';
          return;
        }
        container.innerHTML = items.map(item => {
          const isReply = item.parentId && String(item.parentId) !== '';
          const preview = escHtml(String(item.text || '').slice(0, 60)) + (item.text && item.text.length > 60 ? '…' : '');
          return `
            <div class="news-row" style="${isReply ? 'margin-left:24px; border-left:3px solid #e0d8f0;' : ''}">
              <span class="news-row-date">${escHtml(String(item.date))}</span>
              ${isReply ? '<span class="news-row-badge" style="background:#e0d8f0;color:var(--text-muted);">返信</span>' : ''}
              <span class="news-row-badge">${escHtml(item.name)}</span>
              <span class="news-row-text">${preview}</span>
              <span style="font-size:0.75rem;color:var(--text-muted);flex-shrink:0;">記事ID: ${escHtml(String(item.postId))}</span>
              <button class="btn-delete" onclick="deleteCommentItem('${escHtml(String(item.id))}')">削除</button>
            </div>`;
        }).join('');
      } catch {
        container.innerHTML = '<p style="color:#e53e3e;font-size:0.9rem;">読み込みに失敗しました。</p>';
      }
    }

    async function deleteCommentItem(id) {
      if (!confirm('このコメントを削除しますか？（返信もまとめて削除されます）')) return;
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'deleteComment', id })
        });
        const result = await res.json();
        if (result.success) { showToast('削除しました', 'success'); loadAllComments(); }
        else throw new Error();
      } catch { showToast('削除に失敗しました', 'error'); }
    }

    // ════════════════════════════════════════
    //  資料管理タブ
    // ════════════════════════════════════════

    // ── スケジュール ──
    async function loadSchList() {
      const container = document.getElementById('sch-list-admin');
      container.innerHTML = '読み込み中...';
      try {
        const res = await fetch(GAS_URL + '?action=getSchedule');
        const items = await res.json();
        if (!Array.isArray(items) || items.length === 0) {
          container.innerHTML = '<p style="color:var(--text-muted);font-size:0.9rem;">まだ登録がありません。</p>';
          return;
        }
        container.innerHTML = items.map(item => `
          <div class="news-row">
            <span class="news-row-date">${escHtml(String(item.date))}</span>
            <span class="news-row-badge">${escHtml(item.category || 'その他')}</span>
            <span class="news-row-text" style="flex:1;">${escHtml(item.text)}</span>
            <button class="btn-delete" onclick="deleteSchItem('${escHtml(String(item.id))}')">削除</button>
          </div>`).join('');
      } catch {
        container.innerHTML = '<p style="color:#e53e3e;font-size:0.9rem;">読み込みに失敗しました。</p>';
      }
    }

    document.getElementById('btn-sch-add').addEventListener('click', async () => {
      const category = document.getElementById('sch-category').value;
      const date = document.getElementById('sch-date').value.trim();
      const text = document.getElementById('sch-text').value.trim();
      if (!date || !text) { showToast('日付と内容を入力してください', 'error'); return; }

      const btn = document.getElementById('btn-sch-add');
      btn.disabled = true;
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'saveSchedule', date, text, category })
        });
        const result = await res.json();
        if (result.success) {
          showToast('スケジュールを追加しました', 'success');
          document.getElementById('sch-date').value = '';
          document.getElementById('sch-text').value = '';
          loadSchList();
        } else throw new Error();
      } catch { showToast('追加に失敗しました', 'error'); }
      btn.disabled = false;
    });

    async function deleteSchItem(id) {
      if (!confirm('このスケジュールを削除しますか？')) return;
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'deleteSchedule', id })
        });
        const result = await res.json();
        if (result.success) { showToast('削除しました', 'success'); loadSchList(); }
        else throw new Error();
      } catch { showToast('削除に失敗しました', 'error'); }
    }

    // ── 資料 ──
    async function loadDocList() {
      const container = document.getElementById('doc-list-admin');
      container.innerHTML = '読み込み中...';
      try {
        const res = await fetch(GAS_URL + '?action=getMembers');
        const items = await res.json();
        if (!Array.isArray(items) || items.length === 0) {
          container.innerHTML = '<p style="color:var(--text-muted);font-size:0.9rem;">まだ登録がありません。</p>';
          return;
        }
        container.innerHTML = items.map(item => `
          <div class="news-row">
            <span class="news-row-date">${escHtml(String(item.date))}</span>
            <span class="news-row-badge">${escHtml(item.category)}</span>
            <span class="news-row-text">${escHtml(item.title)}</span>
            <button class="btn-delete" onclick="deleteDocItem('${escHtml(String(item.id))}')">削除</button>
          </div>`).join('');
      } catch {
        container.innerHTML = '<p style="color:#e53e3e;font-size:0.9rem;">読み込みに失敗しました。</p>';
      }
    }

    // ファイル選択時にファイル名を表示
    document.getElementById('doc-file').addEventListener('change', function() {
      const file = this.files[0];
      const info = document.getElementById('doc-file-info');
      if (file) {
        const size = file.size > 1024 * 1024
          ? (file.size / 1024 / 1024).toFixed(1) + ' MB'
          : Math.ceil(file.size / 1024) + ' KB';
        info.textContent = `${file.name}（${size}）`;
      } else {
        info.textContent = '未選択';
      }
    });

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('btn-doc-add').addEventListener('click', async () => {
      const category = document.getElementById('doc-category').value;
      const title = document.getElementById('doc-title').value.trim();
      const date = document.getElementById('doc-date').value.trim();
      const fileInput = document.getElementById('doc-file');
      const file = fileInput.files[0];
      let link = document.getElementById('doc-link').value.trim();

      if (!title || !date) { showToast('タイトルと日付を入力してください', 'error'); return; }
      if (!file && !link) { showToast('ファイルを選択するか、URLを入力してください', 'error'); return; }

      const btn = document.getElementById('btn-doc-add');
      btn.disabled = true;
      try {
        // ファイルが選択されていたらDriveにアップロード
        if (file) {
          showToast('アップロード中...', 'success');
          const base64 = await fileToBase64(file);
          const uploadRes = await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action: 'uploadFile', fileName: file.name, mimeType: file.type || 'application/octet-stream', base64 })
          });
          const uploadResult = await uploadRes.json();
          if (!uploadResult.success) throw new Error(uploadResult.error || 'upload failed');
          link = uploadResult.url;
        }

        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'saveMember', category, title, link, date })
        });
        const result = await res.json();
        if (result.success) {
          showToast('資料を追加しました', 'success');
          document.getElementById('doc-title').value = '';
          document.getElementById('doc-link').value = '';
          document.getElementById('doc-date').value = '';
          fileInput.value = '';
          document.getElementById('doc-file-info').textContent = '未選択';
          loadDocList();
        } else throw new Error();
      } catch (err) { showToast('追加に失敗しました', 'error'); }
      btn.disabled = false;
    });

    async function deleteDocItem(id) {
      if (!confirm('この資料を削除しますか？')) return;
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'deleteMember', id })
        });
        const result = await res.json();
        if (result.success) { showToast('削除しました', 'success'); loadDocList(); }
        else throw new Error();
      } catch { showToast('削除に失敗しました', 'error'); }
    }

    // ════════════════════════════════════════
    //  ニュース管理
    // ════════════════════════════════════════
    // 日付の初期値を今日に
    document.getElementById('news-date').value = new Date().toISOString().slice(0, 10);

    async function loadNewsList() {
      const container = document.getElementById('news-list-admin');
      container.innerHTML = '読み込み中...';
      try {
        const res = await fetch(GAS_URL + '?action=getNews');
        const items = await res.json();
        if (!Array.isArray(items) || items.length === 0) {
          container.innerHTML = '<p style="color:var(--text-muted);font-size:0.9rem;">まだお知らせがありません。</p>';
          return;
        }
        container.innerHTML = items.map(item => `
          <div class="news-row">
            <span class="news-row-date">${escHtml(String(item.date))}</span>
            <span class="news-row-badge">${escHtml(item.badge)}</span>
            <span class="news-row-text">${escHtml(item.text)}${item.link ? ' <a href="'+escHtml(item.link)+'" target="_blank" rel="noopener noreferrer" style="color:var(--main-purple)">🔗</a>' : ''}</span>
            <button class="btn-delete" onclick="deleteNewsItem('${escHtml(String(item.id))}')">削除</button>
          </div>`).join('');
      } catch (err) {
        container.innerHTML = '<p style="color:#e53e3e;font-size:0.9rem;">読み込みに失敗しました。</p>';
      }
    }

    document.getElementById('btn-news-submit').addEventListener('click', async () => {
      const date = document.getElementById('news-date').value;
      const badge = document.getElementById('news-badge').value;
      const text = document.getElementById('news-text').value.trim();
      const link = document.getElementById('news-link').value.trim();
      if (!date || !text) { showToast('日付と本文を入力してください', 'error'); return; }

      const btn = document.getElementById('btn-news-submit');
      btn.disabled = true;
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'saveNews', date: date.replace(/-/g, '.'), badge, text, link })
        });
        const result = await res.json();
        if (result.success) {
          showToast('お知らせを追加しました', 'success');
          document.getElementById('news-text').value = '';
          document.getElementById('news-link').value = '';
          loadNewsList();
        } else throw new Error();
      } catch { showToast('追加に失敗しました', 'error'); }
      btn.disabled = false;
    });

    async function deleteNewsItem(id) {
      if (!confirm('このお知らせを削除しますか？')) return;
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'deleteNews', id })
        });
        const result = await res.json();
        if (result.success) { showToast('削除しました', 'success'); loadNewsList(); }
        else throw new Error();
      } catch { showToast('削除に失敗しました', 'error'); }
    }

    function escHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ════════════════════════════════════════
    //  投稿送信
    // ════════════════════════════════════════
    document.getElementById('btn-submit').addEventListener('click', async () => {
      const title = document.getElementById('post-title').value.trim();
      const author = document.getElementById('post-author').value.trim();
      const group = document.getElementById('post-group').value;
      const content = quill.root.innerHTML;

      if (!title) { showToast('タイトルを入力してください', 'error'); return; }
      if (!author) { showToast('著者名を入力してください', 'error'); return; }
      if (quill.getText().trim().length < 10) {
        showToast('本文を入力してください', 'error'); return;
      }

      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      document.getElementById('submit-msg').textContent = '送信中...';

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'savePost', title, author, group, content })
        });
        const result = await res.json();

        if (result.success) {
          showToast('投稿しました！', 'success');
          // フォームリセット
          document.getElementById('post-title').value = '';
          document.getElementById('post-author').value = '';
          quill.setContents([]);
          document.getElementById('submit-msg').textContent = '';
        } else {
          throw new Error(result.error || 'Save failed');
        }
      } catch (err) {
        showToast('投稿に失敗しました。もう一度お試しください。', 'error');
        console.error(err);
        document.getElementById('submit-msg').textContent = '';
      } finally {
        btn.disabled = false;
      }
    });

    // ════════════════════════════════════════
    //  トースト通知
    // ════════════════════════════════════════
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast ' + type;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => toast.classList.add('show'));
      });
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
